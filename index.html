<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unit Converter</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body class="min-h-screen bg-slate-100">
    <!--<header class="border-b border-slate-200 bg-white">
      <div class="mx-auto max-w-5xl px-6 py-4">
        <h1 class="text-lg font-bold text-slate-900">Unit Converter</h1>
      </div>
    </header> -->
    <header class="border-b border-slate-200 bg-white">
      <div
        class="mx-auto flex max-w-5xl flex-wrap items-center justify-between gap-4 px-6 py-4"
      >
        <a href="#" class="text-lg font-bold text-blue-700"> Unit Converter </a>

        <nav
          aria-label="Main navigation"
          class="flex flex-wrap gap-2 text-sm font-medium"
        >
          <a
            href="#weight"
            data-converter="weight"
            aria-current="page"
            class="rounded-lg bg-blue-50 px-3 py-2 text-blue-700 hover:bg-blue-100"
          >
            Weight
          </a>
          <a
            href="#distance"
            data-converter="distance"
            class="rounded-lg px-3 py-2 text-slate-600 hover:bg-slate-100"
          >
            Distance
          </a>
          <a
            href="#temperature"
            data-converter="temperature"
            class="rounded-lg px-3 py-2 text-slate-600 hover:bg-slate-100"
          >
            Temperature
          </a>
        </nav>
      </div>
    </header>

    <main class="mx-auto max-w-5xl px-6 py-12">
      <div class="mb-8 text-center">
        <h2 id="converter-heading" class="text-3xl font-bold text-slate-900">
          Weight Converter
        </h2>
        <p id="converter-description" class="mt-2 text-slate-600">
          Quickly convert between kilograms and pounds.
        </p>
      </div>

      <section
        class="mx-auto max-w-md overflow-hidden rounded-3xl bg-white shadow-lg"
      >
        <div class="bg-gradient-to-br from-blue-700 to-sky-500 p-6 text-white">
          <div class="flex items-start justify-between gap-4">
            <div>
              <p
                class="text-xs font-semibold uppercase tracking-widest text-blue-100"
              >
                Unit 01
              </p>
              <h3 id="converter-category" class="mt-2 text-2xl font-bold">
                Weight
              </h3>
              <p id="conversion-direction" class="mt-1 text-sm text-blue-100">
                Kilograms to pounds
              </p>
            </div>

            <button
              id="conversion-swap"
              type="button"
              aria-label="Swap conversion direction"
              class="cursor-pointer rounded-full bg-white/20 px-3 py-2 text-xl hover:bg-white/30"
            >
              ⇄
            </button>
          </div>
        </div>

        <div class="p-6">
          <label
            id="conversion-input-label"
            for="conversion-input"
            class="block text-sm font-semibold text-slate-700"
          >
            Kilograms
          </label>

          <div
            class="mt-2 flex items-center rounded-xl border border-slate-300 focus-within:border-blue-500 focus-within:ring-2 focus-within:ring-blue-100"
          >
            <input
              id="conversion-input"
              type="text"
              inputmode="decimal"
              value="0"
              placeholder="e.g. 5  or  1, 5, 10"
              class="w-full min-w-0 bg-transparent px-4 py-3 text-lg text-slate-900 outline-none"
            />
            <span
              id="conversion-unit"
              class="pr-4 text-sm font-semibold text-slate-500"
            >
              kg
            </span>
          </div>

          <p class="mt-2 text-xs text-slate-500">
            Enter one value, or several separated by commas.
          </p>

          <button
            id="convert-button"
            type="button"
            class="mt-5 w-full cursor-pointer rounded-xl bg-blue-700 px-4 py-3 font-semibold text-white transition hover:bg-blue-800"
          >
            Convert weight
          </button>

          <div class="mt-6 rounded-2xl bg-blue-50 p-5">
            <p
              id="conversion-result-label"
              class="text-xs font-semibold uppercase tracking-wider text-blue-700"
            >
              Pounds
            </p>
            <p
              id="conversion-result"
              class="mt-2 text-3xl font-bold text-slate-900"
            >
              0.00
            </p>
          </div>
        </div>
      </section>
    </main>

    <script src="./main.js"></script>
  </body>
</html>
